<!DOCTYPE html>
<html lang="ko">
<head>

  <!-- Google Fonts 연결 (Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<body>

    <nav>

        <li><a href="#education">교육·자격</a></li>
        <li><a href="#contact">문의</a></li>
      </ul>
    </nav>

  <!-- 메인 콘텐츠 영역 -->
  <main>
    <!-- 소개 섹션 -->
    <section id="about">
      <h2>소개</h2>

      <img src="https://placehold.co/300x300?text=Profile" alt="김지은 프로필 사진" width="300" height="300">

      <h2>교육·자격</h2>
      <p>수료 교육 및 취득 자격증 정보가 들어갈 영역입니다.</p>

      <p>연락처, 이메일, 링크 등이 들어갈 영역입니다.</p>

  <!-- 푸터 영역: 저작권 표시 -->
  <footer>
    <p>&copy; 2026 김지은. All rights reserved.</p>
  </footer>

  <!-- 외부 JavaScript 파일 연결 (문서 로드 후 실행되도록 body 끝에 배치) -->
  <script src="js/script.js"></script>
